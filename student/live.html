<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Classes - CKH International School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/db.js"></script>
  <link rel="icon" type="image/png" href="../ckh-nobg.png">

  <style>
    /* ── Class cards ── */
    .class-card {
      background: white;
      border: 1px solid var(--line, rgba(10,39,79,0.14));
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      transition: box-shadow 0.2s;
    }
    .class-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    .class-card.is-ended { opacity: 0.55; }

    .class-date-block {
      flex-shrink: 0;
      width: 52px;
      background: var(--navy-900, #0a274f);
      border-radius: 10px;
      text-align: center;
      padding: 8px 4px;
      color: white;
    }
    .class-card.is-live .class-date-block { background: #dc2626; }
    .class-card.is-ended .class-date-block { background: #94a3b8; }

    .cdb-day {
      font-size: 22px;
      font-weight: 700;
      font-family: 'Fraunces', serif;
      line-height: 1;
    }
    .cdb-mon {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.8;
    }

    .class-info { flex: 1; min-width: 0; }
    .ci-title {
      font-weight: 700;
      font-size: 15px;
      color: var(--ink, #14213d);
      margin: 0 0 4px;
    }
    .ci-meta {
      font-size: 12.5px;
      color: var(--ink-soft, #4a5674);
      margin-bottom: 12px;
    }

    .btn-join {
      background: var(--navy-900, #0a274f);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-join:hover { background: #0f3060; transform: translateY(-1px); }
    .btn-join.live-pulse {
      background: #dc2626;
      animation: btn-pulse 2s infinite;
    }
    @keyframes btn-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.4); }
      50% { box-shadow: 0 0 0 8px rgba(220,38,38,0); }
    }
    .btn-join:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
      transform: none;
      animation: none;
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #ef4444;
      color: white;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .live-dot {
      width: 7px; height: 7px;
      background: white; border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .badge-soon {
      display: inline-block;
      background: #fef3c7; color: #92400e;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
    }
    .badge-upcoming {
      display: inline-block;
      background: #eff6ff; color: #1d4ed8;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
    }
    .badge-ended {
      display: inline-block;
      background: #f1f5f9; color: #64748b;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
    }

    .day-heading {
      font-family: 'Fraunces', serif;
      font-size: 1.05rem;
      color: var(--navy-900, #0a274f);
      margin: 24px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line, rgba(10,39,79,0.12));
    }
    .day-heading:first-child { margin-top: 0; }

    .countdown {
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--ink-soft);
      font-size: 14px;
    }
    .empty-state .es-icon { font-size: 2.5rem; margin-bottom: 12px; }
  </style>
</head>
<body>

<!-- Mobile Header -->
<div class="mobile-header">
  <button class="hamburger-btn" onclick="toggleSidebar()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>
  <div class="mobile-brand">
    <img src="../ckh-nobg.png" alt="CKH Crest">
    <span class="name">CKH Portal</span>
  </div>
  <div style="width:40px;"></div>
</div>

<!-- Overlay -->
<div class="overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="dash-shell">
  <aside class="dash-sidebar" id="sidebar">
    <div class="dash-brand">
      <div class="dash-brand-mark">
        <img src="../ckh-nobg.png" alt="CKH Crest">
        <span class="name">CKH Portal</span>
      </div>
      <button class="sidebar-close-btn" onclick="toggleSidebar()" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="dash-nav-container">
      <a href="dashboard.html" class="dash-nav-item">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <a href="courses.html" class="dash-nav-item">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z"/><path d="M4 19V5.5"/></svg>
        My Courses
      </a>
      <a href="live.html" class="dash-nav-item active">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-4v12l-6-4"/></svg>
        Live Classes
      </a>
      <a href="assignments.html" class="dash-nav-item">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3h6l1 3h3v15H5V6h3l1-3Z"/><path d="M9 12h6M9 16h6"/></svg>
        Assignments
      </a>
      <a href="assessments.html" class="dash-nav-item">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="M9 9h6v6H9z"/></svg>
        Assessments &amp; Exams
      </a>
      <a href="grades.html" class="dash-nav-item">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M11 19V4M18 19v-6"/></svg>
        Grades &amp; Reports
      </a>
      <a href="attendance.html" class="dash-nav-item">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        Attendance
      </a>
      <a href="communication.html" class="dash-nav-item">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H8l-4 4V5Z"/></svg>
        Communication
      </a>
      <a href="resources.html" class="dash-nav-item">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h11l5 5v11H4Z"/><path d="M15 4v5h5"/></svg>
        Resources Library
      </a>
      <a href="account.html" class="dash-nav-item">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
        My Account
      </a>
    </div>
    <div class="dash-bottom-section">
      <div class="dash-user-info">
        <div class="dash-user-avatar" id="userAvatar">AK</div>
        <div class="dash-user-details">
          <p class="dash-user-name" id="userName">Student</p>
          <p class="dash-user-role" id="userRole">Student</p>
        </div>
      </div>
      <button class="dash-logout-btn" onclick="logout(event)">Sign Out</button>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <div>
        <h1>Live Classes</h1>
        <div class="who">Your upcoming and live video sessions</div>
      </div>
      <a href="#" class="exit-link" onclick="logout(event)">← Exit to school site</a>
    </div>

    <!-- Pending admission banner -->
    <div id="pendingBanner" style="display:none;background:#fff8e6;border:1px solid #f0d78c;
         border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:13.5px;
         color:var(--navy-900);"></div>

    <!-- Classes container -->
    <div id="liveClassesContainer">
      <p style="color:var(--ink-soft);font-size:13.5px;">Loading your schedule…</p>
    </div>
  </main>
</div>

<script>
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('open');
  }

  async function logout(e) {
    e.preventDefault();
    await sb.auth.signOut();
    window.location.href = '../index.html';
  }

  function classStatus(scheduledAt, durationMins) {
    const now   = Date.now();
    const start = new Date(scheduledAt).getTime();
    const end   = start + durationMins * 60000;
    const soon  = start - 10 * 60000; // 10 min before
    if (now >= start && now <= end) return 'live';
    if (now >= soon && now < start)  return 'soon';
    if (now > end)                   return 'ended';
    return 'upcoming';
  }

  function formatCountdown(scheduledAt) {
    const diff = new Date(scheduledAt).getTime() - Date.now();
    if (diff <= 0) return '';
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    if (h > 24) {
      const days = Math.floor(h / 24);
      return `Starts in ${days} day${days > 1 ? 's' : ''}`;
    }
    if (h > 0) return `Starts in ${h}h ${m}m`;
    return `Starts in ${m} min`;
  }

  async function renderClasses() {
    const container = document.getElementById('liveClassesContainer');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

    const { data, error } = await sb
      .from('virtual_classes')
      .select('*')
      .order('scheduled_at', { ascending: true });

    if (error || !data || data.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="es-icon">📹</div>
          <p>No live classes scheduled yet.<br>Your teacher will post sessions here.</p>
        </div>`;
      return;
    }

    // Group by date label
    const groups = {};
    data.forEach(cls => {
      const dt = new Date(cls.scheduled_at);
      const dateKey = dt.toDateString(); // e.g. "Sat Aug 24 2026"
      if (!groups[dateKey]) groups[dateKey] = { dt, classes: [] };
      groups[dateKey].classes.push(cls);
    });

    let html = '';
    Object.values(groups).forEach(({ dt, classes }) => {
      const today    = new Date().toDateString();
      const tomorrow = new Date(Date.now() + 86400000).toDateString();
      let dayLabel   = days[dt.getDay()] + ', ' + dt.getDate() + ' ' + months[dt.getMonth()] + ' ' + dt.getFullYear();
      if (dt.toDateString() === today)    dayLabel = '📅 Today — ' + dayLabel;
      if (dt.toDateString() === tomorrow) dayLabel = '🌅 Tomorrow — ' + dayLabel;

      html += `<div class="day-heading">${dayLabel}</div>`;

      classes.forEach(cls => {
        const status   = classStatus(cls.scheduled_at, cls.duration_minutes);
        const jitsiUrl = `https://meet.jit.si/ckh-${cls.room_name}`;
        const dtObj    = new Date(cls.scheduled_at);
        const timeStr  = dtObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const day      = dtObj.getDate();
        const mon      = months[dtObj.getMonth()];

        let statusBadge = '';
        let joinBtn = '';

        if (status === 'live') {
          statusBadge = `<span class="badge-live"><span class="live-dot"></span> LIVE NOW</span>`;
          joinBtn = `<button class="btn-join live-pulse" onclick="window.open('${jitsiUrl}','_blank')">📹 Join Now</button>`;
        } else if (status === 'soon') {
          statusBadge = `<span class="badge-soon">⏳ Starting soon</span>`;
          joinBtn = `<button class="btn-join" onclick="window.open('${jitsiUrl}','_blank')">📹 Join Class</button>`;
        } else if (status === 'ended') {
          statusBadge = `<span class="badge-ended">✓ Ended</span>`;
          joinBtn = `<button class="btn-join" disabled>Class Ended</button>`;
        } else {
          const countdown = formatCountdown(cls.scheduled_at);
          statusBadge = `<span class="badge-upcoming">🗓 Upcoming</span>`;
          joinBtn = `<button class="btn-join" disabled title="Available 10 minutes before class starts">Join Class</button>
                     ${countdown ? `<div class="countdown">${countdown}</div>` : ''}`;
        }

        const cardClass = status === 'live' ? 'class-card is-live' :
                          status === 'ended' ? 'class-card is-ended' : 'class-card';

        html += `
          <div class="${cardClass}">
            <div class="class-date-block">
              <div class="cdb-day">${day}</div>
              <div class="cdb-mon">${mon}</div>
            </div>
            <div class="class-info">
              <div class="ci-title">${cls.title}</div>
              <div class="ci-meta">
                ${cls.teacher_name ? '👤 ' + cls.teacher_name + ' &nbsp;·&nbsp; ' : ''}
                ${cls.subject ? cls.subject + ' &nbsp;·&nbsp; ' : ''}
                ${cls.grade ? cls.grade + ' &nbsp;·&nbsp; ' : ''}
                ⏰ ${timeStr} &nbsp;·&nbsp; ${cls.duration_minutes} min
                &nbsp; ${statusBadge}
              </div>
              ${cls.description ? `<div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;line-height:1.5;">${cls.description}</div>` : ''}
              <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;">
                ${joinBtn}
              </div>
            </div>
          </div>`;
      });
    });

    container.innerHTML = html;
  }

  window.onload = async function() {
    const user = await getCurrentUser();
    if (!user) { window.location.href = '../index.html'; return; }
    if (user.role !== 'student') {
      window.location.href = user.role === 'teacher' ? '../teacher/dashboard.html' : '../admin/dashboard.html';
      return;
    }

    const parts = user.name.split(' ');
    const initials = parts.length >= 2
      ? parts[0][0].toUpperCase() + parts[1][0].toUpperCase()
      : parts[0][0].toUpperCase();
    document.getElementById('userAvatar').textContent = initials;
    document.getElementById('userName').textContent = user.name;
    document.getElementById('userRole').textContent = user.role;

    // Check admission status
    const myApps = await getMyAdmissionApplications(user.email);
    const latest = myApps.sort((a, b) => (b.submittedAt || '').localeCompare(a.submittedAt || ''))[0];
    const banner = document.getElementById('pendingBanner');
    if (latest && latest.status !== 'approved') {
      banner.textContent = 'Your live class schedule will appear here once your admission has been approved.';
      banner.style.display = 'block';
    }

    await renderClasses();

    // Auto-refresh every 30 s so Live badge and join buttons update without reload
    setInterval(renderClasses, 30000);
  };
</script>

</body>
</html>
