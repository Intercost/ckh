<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - CKH Admin Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/db.js"></script>
  <link rel="icon" type="image/png" href="../ckh-nobg.png">
</head>
<body>

<!-- Mobile Header -->
<div class="mobile-header">
  <button class="hamburger-btn" onclick="toggleSidebar()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>
  <div class="mobile-brand">
    <img src="../ckh-nobg.png" alt="CKH Crest">
    <span class="name">CKH Admin Portal</span>
  </div>
  <div style="width:40px;"></div>
</div>

<!-- Overlay -->
<div class="overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="dash-shell">
  <aside class="dash-sidebar" id="sidebar">
    <div class="dash-brand">
      <div class="dash-brand-mark">
        <img src="../ckh-nobg.png" alt="CKH Crest">
        <span class="name">CKH Admin Portal</span>
      </div>
      <button class="sidebar-close-btn" onclick="toggleSidebar()" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="dash-nav-container">
      <a href="dashboard.html" class="dash-nav-item">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <a href="teachers.html" class="dash-nav-item">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c1.2-4 4-6 6.5-6s5.3 2 6.5 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M15.8 13.2c2.6.3 4.6 2.3 5.5 5.3"/></svg>
        Teacher Management
      </a>
      <a href="admissions.html" class="dash-nav-item">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 9l10-5 10 5-10 5-10-5Z"/><path d="M6 11v5c0 1.5 2.5 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v6"/></svg>
        Admissions
      </a>
      <a href="academics.html" class="dash-nav-item">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
        Academics
      </a>
      <a href="finance.html" class="dash-nav-item">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 9h.01M18 15h.01"/></svg>
        Finance
      </a>
      <a href="reports.html" class="dash-nav-item">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V10M10 21V3M16 21v-7M22 21H2"/></svg>
        Reports & Analytics
      </a>
      <a href="account.html" class="dash-nav-item active">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
        My Account
      </a>
    </div>
    <div class="dash-bottom-section">
      <div class="dash-user-info">
        <div class="dash-user-avatar" id="userAvatar">CA</div>
        <div class="dash-user-details">
          <p class="dash-user-name" id="userName">CKH Admin</p>
          <p class="dash-user-role" id="userRole">Administrator</p>
        </div>
      </div>
      <button class="dash-logout-btn" onclick="logout(event)">Sign Out</button>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <div>
        <h1>My account</h1>
        <div class="who">Your profile and login settings</div>
      </div>
      <a href="#" class="exit-link" onclick="logout(event)">← Exit to school site</a>
    </div>

    <div class="card" style="max-width:640px;margin-bottom:24px;">
      <div class="section-head">
        <h2>Profile</h2>
      </div>
      <div class="profile-field">
        <label>Full name</label>
        <div class="profile-value" id="profName"></div>
      </div>
      <div class="profile-field">
        <label>School email</label>
        <div class="profile-value" id="profEmail"></div>
      </div>
      <div class="profile-field">
        <label>Role</label>
        <div class="profile-value">Administrator</div>
      </div>
    </div>

    <div class="card" style="max-width:640px;">
      <div class="section-head">
        <h2>Change password</h2>
      </div>
      <form onsubmit="submitPasswordChange(event)">
        <div class="field">
          <label for="currentPass">Current password</label>
          <input id="currentPass" type="password" required>
        </div>
        <div class="field">
          <label for="newPass">New password</label>
          <input id="newPass" type="password" required>
        </div>
        <div class="field">
          <label for="confirmPass">Confirm new password</label>
          <input id="confirmPass" type="password" required>
        </div>
        <button type="submit" class="btn btn-gold">Update password</button>
        <div id="passError" class="error-message"></div>
        <div id="passSuccess" class="success-message" style="display:none;">Password updated.</div>
      </form>
    </div>

  </main>
</div>

<script>
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    sidebar.classList.toggle('open');
    overlay.classList.toggle('open');
  }

  async function logout(e) {
    e.preventDefault();
    await sb.auth.signOut();
    window.location.href = '../index.html';
  }

  async function requireAdmin() {
    const user = await getCurrentUser();
    if (!user) {
      window.location.href = '../index.html';
      return null;
    }
    if (user.role !== 'admin') {
      window.location.href = user.role === 'teacher' ? '../teacher/dashboard.html' : '../student/dashboard.html';
      return null;
    }
    const nameParts = user.name.split(' ');
    const initials = nameParts.length >= 2
      ? nameParts[0][0].toUpperCase() + nameParts[1][0].toUpperCase()
      : nameParts[0][0].toUpperCase();
    document.getElementById('userAvatar').textContent = initials;
    document.getElementById('userName').textContent = user.name;
    document.getElementById('userRole').textContent = 'Administrator';
    return user;
  }

  let currentUser = null;

  async function submitPasswordChange(e) {
    e.preventDefault();
    const current = document.getElementById('currentPass').value;
    const next = document.getElementById('newPass').value;
    const confirm = document.getElementById('confirmPass').value;
    const errEl = document.getElementById('passError');
    const okEl = document.getElementById('passSuccess');
    errEl.textContent = '';
    okEl.style.display = 'none';

    if (next !== confirm) {
      errEl.textContent = 'New passwords do not match.';
      return false;
    }

    // Re-authenticate with the current password to confirm it's correct
    // before changing it (Supabase Auth never stores/returns it in plain text).
    const { error: reauthError } = await sb.auth.signInWithPassword({ email: currentUser.email, password: current });
    if (reauthError) {
      errEl.textContent = 'Current password is incorrect.';
      return false;
    }

    const { error } = await sb.auth.updateUser({ password: next });
    if (error) {
      errEl.textContent = error.message || 'Could not update your password.';
      return false;
    }
    okEl.style.display = 'block';
    e.target.reset();
    return false;
  }

  window.onload = async function() {
    currentUser = await requireAdmin();
    if (!currentUser) return;
    document.getElementById('profName').textContent = currentUser.name;
    document.getElementById('profEmail').textContent = currentUser.email;
  };

</script>

</body>
</html>
